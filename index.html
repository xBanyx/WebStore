<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RHJ WebStore — Currently Down</title>
<style>
  :root{
    --primary:#d9480f;
    --primary-dark:#b8380c;
    --bg:#faf7f2;
    --card:#ffffff;
    --text:#26221f;
    --muted:#8a8078;
    --border:#eee3d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--card); border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,.08);
    max-width:380px; width:100%; padding:40px 30px; text-align:center;
  }
  .icon{
    width:68px; height:68px; border-radius:50%; margin:0 auto 20px;
    background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .icon svg{width:32px;height:32px;}
  h1{margin:0 0 10px; font-size:21px;}
  p{margin:0 0 6px; color:var(--muted); font-size:14px; line-height:1.6;}
  .brand{
    display:inline-block; margin-top:22px; padding-top:18px; border-top:1px solid var(--border);
    width:100%; font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--primary-dark);
  }
  .dots{display:flex; gap:6px; justify-content:center; margin-top:22px;}
  .dots span{
    width:7px; height:7px; border-radius:50%; background:var(--primary);
    opacity:.35; animation:pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2){animation-delay:.2s;}
  .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes pulse{
    0%, 100%{opacity:.35; transform:scale(1);}
    50%{opacity:1; transform:scale(1.25);}
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4a2 2 0 1 1 4 0v6l3-1v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9l3 1V4a2 2 0 1 1 4 0"></path>
      </svg>
    </div>
    <h1>We'll Be Right Back</h1>
    <p>RHJ WebStore is currently down for maintenance.</p>
    <p>Thanks for your patience — please check back soon.</p>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="brand">RHJ WEBSTORE</div>
  </div>

</body>
</html>
